# Rust-side verification of the package's extendr crate.
# This compiles `src/rust/` directly (independent of full R-CMD-check))

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, release]
  pull_request:
    branches: [main, master, develop, release]

name: rust-check

jobs:
  rust-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/rust

    steps:
      - uses: actions/checkout@v4

      - name: Install R (required by extendr-api build scripts)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Rust toolchain (>= 1.85 for edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo registry / git / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (rlib)
        run: cargo build --lib --verbose

      - name: Build document binary
        run: cargo build --bin document --verbose

      - name: Clippy
        run: cargo clippy --lib -- -D warnings
        continue-on-error: true
