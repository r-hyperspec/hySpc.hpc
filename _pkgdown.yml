# ── hySpc.hpc pkgdown configuration ──

url: https://r-hyperspec.github.io/hySpc.hpc/

template:
  params:
    bootswatch: cerulean
    noindex: false

development:
  mode: auto

# ── Navigation Bar ──
navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Get Started
      href: articles/get_started.html
    articles:
      text: Articles
      menu:
        - text: "--- Getting Started ---"
        - text: "Getting Started with hySpc.hpc"
          href: articles/get_started.html
        - text: "--- Core Algorithms & Solvers ---"
        - text: "Spatial Smoothing with Rust"
          href: articles/spatial_smoothing.html
        - text: "--- Performance Scaling ---"
        - text: "Benchmarking hySpc.hpc: R vs Rust Backend"
          href: articles/benchmarking.html
        - text: "--- HPC & Distributed Computing ---"
        - text: "Distributed Spectroscopy: Global Supercomputing Consortia"
          href: articles/hpc_cluster.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/r-hyperspec/hySpc.hpc

# ── Articles Index Page ──
articles:
  - title: "Getting Started"
    desc: "Installation, quickstart guide, and basic workflow examples."
    contents:
      - get_started
  - title: "Core Spatial Algorithms & Solvers"
    desc: "Mathematical formulations of spatial graph Laplacians and native Rust Krylov solvers."
    contents:
      - spatial_smoothing
  - title: "Performance Scaling & Benchmarking"
    desc: "Quantitative benchmarks comparing pure R vs Rust backends across image sizes."
    contents:
      - benchmarking
  - title: "HPC Cluster Deployment & Cloud Infrastructure"
    desc: "Orchestrating hySpc.hpc across Slurm supercomputing clusters, AWS Batch, and GCP data centers."
    contents:
      - hpc_cluster

# ── Function Reference ──
reference:
  - title: "Spatial-Spectral Smoothing"
    desc: "High-performance spatial Laplacian algorithms for hyperspectral images."
    contents:
      - graphSmooth
      - graph_smooth_r
      - graph_smooth_rust
      - build_adjacency_r
      - build_laplacian_r
  - title: "HPC Thread Pool & Quota Management"
    desc: "Utilities for auto-detecting scheduler CPU quotas and configuring Rayon thread pools."
    contents:
      - set_hpc_threads
      - get_hpc_threads
      - detect_hpc_cores
      - with_hpc_threads
      - hpc_threads
      - set_hpc_threads_rust
      - get_hpc_threads_rust
  - title: "Native FFI Utilities"
    desc: "FFI bridge routines between R dgCMatrix and Rust sparse matrices."
    contents:
      - sparse_row_sums
      - '".dgc_slots"'
      - demo_function

authors:
  Erick Oduniyi:
    href: https://github.com/eoduniyi
  Tamaghna Chattopadhyay:
    href: https://github.com/r-hyperspec
  Bryan A. Hanson:
    href: http://academic.depauw.edu/hanson_web/
  Vilmantas Gegzna:
    href: https://orcid.org/0000-0002-9500-5167

figures:
  dev: grDevices::png
  dpi: 96
  dev.args: []
  fig.ext: png
  fig.width: 4.854
  fig.height: 3
  fig.retina: 2
  fig.asp: 1.618
